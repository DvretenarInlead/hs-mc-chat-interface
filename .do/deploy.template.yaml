# Alternative: Deploy without Docker (Node.js buildpack)
# Use this if you prefer DigitalOcean's built-in Node.js buildpack instead of Docker.

name: relationship-intelligence

services:
  - name: web
    github:
      repo: YOUR_GITHUB_ORG/hs-mc-chat-interface
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    run_command: npx prisma migrate deploy && npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: professional-xs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
    routes:
      - path: /
    envs:
      - key: HUBSPOT_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: HUBSPOT_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: HUBSPOT_REDIRECT_URI
        scope: RUN_TIME
        value: ${APP_URL}/api/auth/callback
      # No HUBSPOT_PRIVATE_APP_TOKEN needed — MCP uses per-user OAuth tokens
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: TOKEN_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NEXTAUTH_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # ── CRM Access Mode ──
      # "read_only" = safe mode, only CRM queries, no writes
      # "read_write" = full access (create notes, tasks, update records)
      - key: MCP_MODE
        scope: RUN_TIME
        value: read_only
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-1vcpu-1gb
    num_nodes: 1
